# Construit et publie l'image multi-arch sur ghcr.io/simpsonus/batons.
#
# À chaque push sur main :
#   - si la version de ha-addon/config.yaml n'a pas encore de tag vX.Y.Z :
#       image X.Y.Z + latest, puis création du tag et de la release GitHub (automatique) ;
#   - sinon : image « edge » seulement.
# Il suffit donc d'augmenter la version (bootstrap.php + config.yaml) et de pousser.
# Les tests (tests/unit.php, tests/e2e.py) passent d'abord : en cas d'échec, rien n'est publié.
name: Image Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Tests unitaires et parcours dans un navigateur : aucune image n'est publiée s'ils échouent.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, intl, iconv
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright (Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Tests unitaires
        run: php tests/unit.php
      - name: Parcours dans le navigateur
        run: python tests/e2e.py

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' ha-addon/config.yaml)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Version $version déjà publiée : image edge seulement"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=edge" >> "$GITHUB_OUTPUT"
            echo "tags=$image:edge" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version $version"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tags=$image:$version,$image:latest,$image:edge" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: BATONS_VERSION=${{ steps.v.outputs.version }}

      - name: Release GitHub
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "Bâtons ${{ steps.v.outputs.version }}" \
            --notes "$(git log -1 --format=%B "$GITHUB_SHA")"
